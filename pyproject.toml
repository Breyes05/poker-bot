[project]
name = "pokerbot"
version = "0.1.0"
description = "Game-theoretic poker agents: CFR, MCCFR, and Deep CFR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
deep = ["torch>=2.2"]
viz = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pokerbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
